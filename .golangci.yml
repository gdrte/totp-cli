run:
  timeout: 5m
  issues-exit-code: 1
  tests: false
  allow-parallel-runners: true
  go: 1.22

linters-settings:
  gci:
    local-prefix: github.com/gdrte/totp-go
  goimports:
    local-prefix: github.com/gdrte/totp-go
  govet:
    shadow: true
  misspell:
    locale: US
  cyclop:
    max-complexity: 15
    skip-tests: true
  nolintlint:
    allow-leading-space: false
    allow-unused: false
    require-explanation: true
    require-specific: false
  varnamelen:
    ignore-names:
      - ns
      - err
      - iv
  depguard:
    rules:
      main:
        allow:
          - $gostd
          - filippo.io/age
          - github.com/urfave/cli/v2
          - github.com/gdrte/totp-go
          - github.com/kardianos/osext
          - github.com/yitsushi/github-release-check

issues:
  exclude-rules:
  - path: _test\.go
    linters:
    - goerr113
    - gocyclo
    - errcheck
    - gosec
    - dupl
    - funlen
    - scopelint
    - testpackage
    - varnamelen
  - path: internal/cmd/
    linters:
    - forbidigo
  - text: "sig: func github.com/gdrte/totp-go/"
    linters:
    - wrapcheck
  - text: "sig: func \\(\\*?github.com/gdrte/totp-go/"
    linters:
    - wrapcheck
  - path: internal/info
    linters:
    - gochecknoglobals
  - source: "// .* #\\d+"
    # Ignore TODO lines if they have a GitHub Issue reference.
    linters:
    - godox

linters:
  enable-all: true
  disable:
    # Deprecated
    - gomnd
    - exportloopref
    - execinquery

    # Disabled because I need naked return to handle extra errors in defer.
    - nakedret

    # Just disabled them...
    - exhaustruct

